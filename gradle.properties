# 构建基座: IntelliJ IDEA Community 2023.3 = IntelliJ Platform 233。
# 用 IC 而非 AI：本插件不使用 Android 插件的私有 API，产物同样能装进 Android Studio，
# 且额外兼容 IDEA。按最低支持版本构建，可避免误用较新平台才有的 API。
platformVersion=2023.3.8
pluginSinceBuild=233

# 上界留空 = 不设 until-build，插件不会被新版 IDE 的安装器按声明拒绝。
#
# 为什么不写死一个数字：写死就意味着每出一个新版 IDE 都要跟着改一次，
# 中间那段时间用户只会看到「not compatible with the current version of the IDE」
# 而无从判断到底是真不兼容还是声明过期。实测 platform 233 与 261 都是 Compatible。
#
# 兼容性由 plugin verifier 把关，而不是这个数字：
#   ./gradlew verifyPlugin -PverifyAgainstIde="<你的 IDE 安装目录>"
# 升级平台后请务必跑一次，真出现不兼容再在这里设上界。
pluginUntilBuild=

pluginGroup=dev.squeeze
pluginVersion=0.1.1

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.caching=true
org.gradle.parallel=true
kotlin.stdlib.default.dependency=false
